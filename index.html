<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Call Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one file, two roles. Host = big-screen game master view with a side rail; player = one-thumb phone view. */
:root{
  color-scheme: dark;
  --bg:#16112a; --panel:#211a3b; --panel-2:#2b2250; --line:#3d3369;
  --fg:#f6eedd; --muted:#b2a7cf;
  --amber:#f5b53f; --amber-ink:#2b1b00;
  --mint:#5cd6a4; --coral:#ff7361; --violet:#a594ff;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{min-height:100%}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.5;
  background:radial-gradient(1200px 600px at 85% -10%, #2c1f55 0%, transparent 60%), var(--bg);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 18px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.02em;color:var(--amber);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand small{font-family:var(--body);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;background:var(--amber);color:var(--amber-ink);font-size:16px;transition:transform .12s, filter .12s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn.big{padding:16px 30px;font-size:18px}
.btn.warn{background:var(--coral);color:#2a0700}
.hero{display:grid;gap:10px;padding-block:8px 24px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,9vw,92px);line-height:.92;margin:0;text-wrap:balance}
.hero h1 span{color:var(--amber)}
.hero p{margin:0;color:var(--muted);max-width:60ch;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px;align-content:start;min-width:0}
.panel h2{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:800}
.hint{margin:0;color:var(--muted);font-size:14px}
.span2{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--panel-2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.label{font-size:13px;color:var(--muted);font-weight:700}
.row{display:flex;gap:18px;flex-wrap:wrap}
.row > div{display:grid;gap:8px}
.err{color:var(--coral);font-weight:700;margin:0}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:inherit}
.tag{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--panel-2);border:1px solid var(--line)}
.tag.diff{color:var(--dc);border-color:var(--dc)}
.d-e{--dc:var(--mint)} .d-m{--dc:var(--amber)} .d-h{--dc:var(--coral)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.input{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px;font-weight:700;min-width:0;width:100%}
.input:focus{border-color:var(--amber);outline:none}
select.input{font-size:15px;padding:8px 10px}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
}

.o0{--oc:var(--amber)} .o1{--oc:var(--mint)} .o2{--oc:var(--coral)} .o3{--oc:var(--violet)}
.home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.home{grid-template-columns:minmax(0,1fr)}}
.home .panel{padding:24px}
.home h3{margin:0;font-family:var(--display);font-weight:400;font-size:28px}
.field{display:grid;gap:6px}
.codeinput{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-size:28px;text-align:center}
.banner{border-radius:12px;padding:10px 14px;font-weight:700;background:var(--panel-2);border:1px solid var(--line)}
.banner.bad{border-color:var(--coral);color:var(--coral)}
.banner.ok{border-color:var(--mint);color:var(--mint)}

/* host */
.host{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.host{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,36px);display:grid;gap:20px;min-width:0}
.rail{display:grid;gap:16px;min-width:0}
.joinbox{display:grid;gap:10px;justify-items:center;text-align:center;padding-block:10px}
.bigcode{font-family:var(--display);font-size:clamp(64px,12vw,140px);line-height:1;letter-spacing:.12em;color:var(--amber);margin:0}
.joinlink{font-size:15px;color:var(--muted);overflow-wrap:anywhere;max-width:100%}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border-radius:999px;padding:6px 14px;font-weight:700;background:var(--panel-2);border:2px solid var(--line)}
.pchip.done{border-color:var(--mint);color:var(--mint)}
.pchip.off{opacity:.45;text-decoration:line-through}
.hq{font-size:clamp(26px,3.8vw,52px);line-height:1.18;font-weight:800;margin:0;text-wrap:balance}
.hopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.hopts{grid-template-columns:minmax(0,1fr)}}
.hopt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;border-radius:16px;padding:14px 16px;background:var(--panel-2);border:2px solid var(--oc);font-size:clamp(17px,2vw,26px);font-weight:700;position:relative;overflow:hidden;min-width:0}
.hopt .k{width:1.7em;height:1.7em;border-radius:10px;background:var(--oc);color:var(--amber-ink);display:grid;place-items:center;font-family:var(--display);font-size:.8em}
.hopt .n{font-family:var(--display);font-size:.9em;font-variant-numeric:tabular-nums}
.hopt .barfill{position:absolute;inset:0 auto 0 0;background:var(--oc);opacity:.14;z-index:0}
.hopt > *{position:relative;z-index:1}
.hopt.dim{opacity:.35}
.hopt.right{box-shadow:0 0 0 3px var(--oc)}
.tline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.track{height:12px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;background:var(--amber);width:100%}
.fill.low{background:var(--coral)}
.tnum{font-family:var(--display);font-size:24px;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.board{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--panel-2)}
.board .pos{font-family:var(--display);color:var(--amber)}
.board .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .nm small{display:block;font-size:12px;font-weight:700}
.board .sc{font-family:var(--display);font-variant-numeric:tabular-nums}
.up{color:var(--mint)} .miss{color:var(--coral)}
.sips{border:2px dashed var(--coral);border-radius:14px;padding:12px 16px;display:grid;gap:4px}
.sips b{color:var(--coral);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.answerline{font-size:20px;margin:0}
.answerline b{color:var(--mint)}

/* typed answers */
.typed{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.typed .input{font-size:20px}
.mine-text{font-size:18px;font-weight:700;margin:0}
.mine-text q{color:var(--amber)}
.judge{display:flex;flex-wrap:wrap;gap:8px}
.jchip{display:flex;gap:8px;align-items:center;border-radius:12px;padding:8px 12px;border:2px solid var(--line);background:var(--panel-2);font-weight:700;text-align:left;max-width:100%}
.jchip .who{color:var(--muted);font-size:13px}
.jchip .said{overflow-wrap:anywhere}
.jchip.ok{border-color:var(--mint)} .jchip.ok .mark{color:var(--mint)}
.jchip.no{border-color:var(--coral)} .jchip.no .mark{color:var(--coral)}
.jchip.none{opacity:.5;cursor:default}
.bigans{font-family:var(--display);font-weight:400;font-size:clamp(32px,6vw,72px);line-height:1.05;color:var(--mint);margin:0;overflow-wrap:anywhere}

.qr{background:var(--fg);padding:12px;border-radius:16px;line-height:0}
.qr img,.qr canvas{display:block;width:180px;height:180px}
.hostnote{border:1px dashed var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.roomtag{font-family:var(--display);color:var(--amber);font-size:22px;letter-spacing:.1em}

/* player */
.phone{max-width:520px;margin:0 auto;display:grid;gap:16px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px;text-align:center}
.pcard h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1.05;text-wrap:balance}
.pq{font-size:20px;font-weight:700;margin:0;text-wrap:balance}
.pbtns{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.pbtn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:0;border-radius:16px;padding:16px;background:var(--oc);color:var(--amber-ink);font-weight:800;font-size:19px;min-height:64px}
.pbtn .k{width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.18);display:grid;place-items:center;font-family:var(--display);font-size:16px}
.pbtn[disabled]{opacity:.35;cursor:default}
.pbtn.mine{opacity:1;outline:4px solid var(--fg);outline-offset:2px}
.verdict{font-family:var(--display);font-size:clamp(40px,12vw,64px);line-height:1;margin:0}
.verdict.good{color:var(--mint)} .verdict.bad{color:var(--coral)}
.stat{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}
.stat div{display:grid}
.stat b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.sipcall{background:var(--coral);color:#2a0700;border-radius:14px;padding:12px;font-weight:800;font-size:18px}
</style>
</head>
<body>

    <div class="brand">Last Call Live <small id="ver">v3</small> <small id="where"></small></div>

  </header>
  <main id="app"></main>
</div>

// Forgiving check for typed answers: ignores case, accents, punctuation and "the/a/an",
// allows a few typos (scaled to length), accepts surnames / key words, and matches numbers by value.
function norm(t){
  return String(t || "").replace(/\u00be/g, " 3/4").replace(/\u00bd/g, " 1/2").replace(/\u00bc/g, " 1/4")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
    .replace(/(\d),(\d)/g, "$1$2").replace(/&/g, " and ")
    .replace(/[^a-z0-9./ ]+/g, " ").replace(/\s+/g, " ").trim().replace(/^(the|a|an) /, "");
}
function lev(a, b){
  if (a === b) return 0;
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let pp = null, prev = Array.from({length:n+1}, (_, j) => j);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      if (pp && i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) cur[j] = Math.min(cur[j], pp[j-2] + 1);
    }
    pp = prev; prev = cur;
  }
  return prev[n];
}
const tol = len => len <= 3 ? 0 : len <= 8 ? 1 : Math.max(2, Math.floor(len * 0.15));
const squash = t => t.replace(/ /g, "");
// word by word when the word counts line up ("Aunt May" is not "Aunt Mary"), otherwise as one string
function close(t, a){
  const tw = t.split(" "), aw = a.split(" ");
  if (tw.length === aw.length) return aw.every((w, i) => lev(tw[i], w) <= tol(w.length));
  return lev(squash(t), squash(a)) <= tol(squash(a).length);
}
const NUM = /\d+(\.\d+)?/g;
const nums = t => (t.match(NUM) || []).map(Number);
const words = t => t.replace(NUM, " ").replace(/\s+/g, " ").trim();
function rawMatch(t, a){
  if (!t || !a) return false;
  const an = nums(a), tn = nums(t);
  if (an.length && tn.length){
    // numbers must match exactly; any words typed with them must fit too ("8 minutes", not "8 seconds")
    if (tn.length !== an.length || tn.some((x, i) => x !== an[i])) return false;
    const tw = words(t), aw = words(a);
    return !tw || !aw || close(tw, aw) || aw.includes(tw) || (tw.length >= 3 && !tw.includes(" ") && aw.split(" ")[0].startsWith(tw.slice(0, 3)));
  }
  if (close(t, a)) return true;
  if (a.length >= 4 && t.includes(a)) return true;
  // a key part of the answer is enough, e.g. "Spielberg" for "Steven Spielberg"
  const aw = a.split(" "), total = squash(a).length, tcount = t.split(" ").length;
  for (let i = 0; i < aw.length; i++) for (let j = i + 1; j <= aw.length; j++){
    if (i === 0 && j === aw.length) continue;
    if (j - i !== tcount) continue;
    const span = aw.slice(i, j).join(" "), len = squash(span).length;
    if (len >= 4 && len >= total * 0.4 && close(t, span)) return true;
  }
  return false;
}
function isMatch(typed, answer, wrongs){
  const t = norm(typed), a = norm(answer);
  if (!rawMatch(t, a)) return false;
  // reject a guess that is really one of the wrong options ("Tuesday" when the answer is "Thursday")
  const d = lev(squash(t), squash(a));
  return !(wrongs || []).some(w => { const n = norm(w); return n && n !== a && (rawMatch(t, n) && lev(squash(t), squash(n)) <= d); });
}

/* =================== TRANSPORT =================== */
function connectBroker(i, onConnect, onFail, opts){
  const c = mqtt.connect(BROKERS[i], {connectTimeout:8000, reconnectPeriod:2000, keepalive:20, clean:true, ...(opts || {})});
  let ok = false;
  const t = setTimeout(() => { if (!ok){ try{ c.end(true); }catch(e){} onFail(); } }, 9000);
  c.once("connect", () => { ok = true; clearTimeout(t); onConnect(c); });
  return c;
}
const pub = (topic, obj, retain) => { try{ if (net) net.publish(topic, obj == null ? "" : JSON.stringify(obj), {qos:1, retain:!!retain}); }catch(e){} };
const parse = b => { try{ return JSON.parse(b.toString()); }catch(e){ return null; } };
function dropNet(){ if (net){ try{ net.end(true); }catch(e){} net = null; } }
function startBeat(){
  if (beatId) clearInterval(beatId);
  beatId = setInterval(() => {
    if (role === "host" && H){
      let changed = false;
      for (const p of Object.values(H.players)) if (p.online && Date.now() - (p.lastSeen || 0) > 16000){ p.online = false; changed = true; }
      if (changed){ broadcast(); render(); }
    } else if (role === "player" && P && net && net.connected){
      if (P.ever) pub(TOPIC + P.code + "/up", {t:"ping", pid:P.pid, name:P.name});
      else if (P.hostOnline) sendJoin();
    }
  }, 5000);
}

const defaultSettings = () => ({cats:Object.keys(CATS), diff:"mixed", count:15, timer:30, drinks:true, mode:"typed"});
const saveHost = () => store.set("lastcall-live-host", H);

function hostCreate(resume){
  role = "host";
  if (!resume){
    const prev = store.get("lastcall-live-host");
    H = {code:"", status:"connecting", settings: {...defaultSettings(), ...(prev?.settings || {})}, players:{}, phase:"lobby", qn:0, deck:[], answers:{}, results:{}, qStartedAt:0, qEndsAt:0};
    H.code = Array.from({length:4}, () => rand(CODE_CHARS)).join("");
  }
  H.status = "connecting";
  Object.values(H.players).forEach(p => p.online = false);
  openHostNet(0);
  render();
}

function openHostNet(i){
  dropNet();
  const base = TOPIC + H.code;
  connectBroker(i, client => {
    if (role !== "host"){ client.end(true); return; }
    net = client; H.broker = i; H.status = "online";
    const announce = () => { client.subscribe(base + "/up", {qos:1}); pub(base + "/host", {online:true}, true); };
    announce();
    client.on("connect", () => { H.status = "online"; announce(); render(); });
    client.on("offline", () => { H.status = "connecting"; render(); });
    client.on("message", (topic, buf) => { if (topic === base + "/up"){ const m = parse(buf); if (m) hostOnMsg(m); } });
    saveHost(); render(); startBeat();
  }, () => {
    if (i + 1 < BROKERS.length) openHostNet(i + 1);
    else { H.status = "error"; H.error = "Can't reach the game server. Check the internet connection, then press Retry."; render(); }
  }, {will:{topic:base + "/host", payload:JSON.stringify({online:false}), qos:1, retain:true}});
}

function hostOnMsg(msg){
  if (!msg || typeof msg !== "object") return;
  const pid = String(msg.pid || "").slice(0, 20);
  if (!pid) return;
  if (msg.t === "leave"){ const p = H.players[pid]; if (p && p.online){ p.online = false; broadcast(); render(); } return; }
  if (msg.t === "join" || msg.t === "ping"){
    let name = String(msg.name || "").trim().slice(0, 16) || "Player";
    let p = H.players[pid];
    const wasOnline = !!(p && p.online);
    if (!p){
      if (H.phase !== "lobby" && Object.keys(H.players).length >= 40) return;
      const taken = new Set(Object.values(H.players).map(x => x.name.toLowerCase()));
      let n = name, i = 2; while (taken.has(n.toLowerCase())) n = `${name} ${i++}`;
      p = H.players[pid] = {name:n, score:0, joinedAt:Date.now()};
    }
    p.online = true; p.lastSeen = Date.now();
    if (msg.t === "join" || !wasOnline){ saveHost(); broadcast(); render(); }
    return;
  }
  if (msg.t === "answer" && H.players[pid]){
    H.players[pid].lastSeen = Date.now();
    if (H.phase !== "question" || msg.qn !== H.qn || H.answers[pid]) return;
    if (H.qEndsAt && Date.now() > H.qEndsAt + 750) return;
    if (H.mode === "typed"){
      const text = String(msg.text || "").trim().slice(0, 60);
      if (!text) return;
      H.answers[pid] = {text, ms: Date.now() - H.qStartedAt};
    } else {
      const i = +msg.i; if (!(i >= 0 && i < 4)) return;
      H.answers[pid] = {i, ms: Date.now() - H.qStartedAt};
    }
    saveHost(); sendView(pid); render();
    const online = Object.keys(H.players).filter(id => H.players[id].online);
    if (online.length && online.every(id => H.answers[id])) setTimeout(() => { if (H.phase === "question") reveal(); }, 600);
  }
}

function ranking(){ return Object.entries(H.players).map(([pid, p]) => ({pid, ...p})).sort((a,b) => b.score - a.score || a.joinedAt - b.joinedAt); }
function rankOf(pid){ const me = H.players[pid].score; return 1 + Object.values(H.players).filter(p => p.score > me).length; }

function viewFor(pid){
  const p = H.players[pid], q = H.deck[H.qn];
  const v = {t:"view", code:H.code, phase:H.phase, name:p.name, score:p.score, rank:rankOf(pid), players:Object.keys(H.players).length,
    qn:H.qn, count:H.deck.length || H.settings.count, drinks:H.settings.drinks};
  if (H.phase === "lobby") v.names = Object.values(H.players).filter(x => x.online).map(x => x.name);
  if (q && (H.phase === "question" || H.phase === "reveal")){
    v.mode = H.mode;
    v.q = {cat:CATS[q.cat].name, d:q.d, text:q.q, options:H.mode === "typed" ? null : q.options};
    const mine = H.answers[pid];
    v.my = mine ? (H.mode === "typed" ? mine.text : mine.i) : null;
  }
  if (H.phase === "question" && H.qEndsAt){ v.remaining = H.qEndsAt - Date.now(); v.timer = H.settings.timer; }
  if (H.phase === "reveal"){ const r = H.results[pid] || {correct:false, pts:0}; v.result = {ai:q.ai, answer:q.a, correct:r.correct, pts:r.pts}; }
  if (H.phase === "final") v.top = ranking().slice(0, 5).map(x => ({name:x.name, score:x.score}));
  return v;
}
function sendView(pid){ if (H.players[pid]) pub(TOPIC + H.code + "/down/" + pid, viewFor(pid)); }
function broadcast(){ for (const [pid, p] of Object.entries(H.players)) if (p.online) sendView(pid); }

function split(n){ const e = Math.round(n/3), h = Math.round(n/3); return [...Array(e).fill("e"), ...Array(n-e-h).fill("m"), ...Array(h).fill("h")]; }
function buildDeck(){
  const s = H.settings, used = {}, out = [];
  const diffs = s.diff === "mixed" ? split(s.count) : Array(s.count).fill(s.diff);
  let cats = [];
  for (const d of diffs){
    if (!cats.length) cats = shuffle(s.cats);
    const cat = cats.shift();
    for (const dd of [d, "m", "e", "h"]){
      const k = cat + dd; used[k] = used[k] || [];
      const free = CATS[cat][dd].map((_,i) => i).filter(i => !used[k].includes(i) && (s.mode !== "typed" || typeable(CATS[cat][dd][i])));
      if (!free.length) continue;
      const i = rand(free); used[k].push(i);
      const [q, a, ...w] = CATS[cat][dd][i]; const options = shuffle([a, ...w]);
      out.push({cat, d:dd, q, a, options, ai:options.indexOf(a)}); break;
    }
  }
  return out;
}

function hostStart(){
  Object.values(H.players).forEach(p => p.score = 0);
  H.mode = H.settings.mode; H.deck = buildDeck(); H.qn = 0;
  startQuestion();
}
function startQuestion(){
  H.phase = "question"; H.answers = {}; H.results = {};
  H.qStartedAt = Date.now(); H.qEndsAt = H.settings.timer ? H.qStartedAt + H.settings.timer * 1000 : 0;
  saveHost(); broadcast(); render(); startTick();
}
function reveal(){
  if (H.phase !== "question") return;
  const q = H.deck[H.qn], T = H.settings.timer * 1000;
  for (const [pid, p] of Object.entries(H.players)){
    const a = H.answers[pid];
    const correct = !!a && (H.mode === "typed" ? isMatch(a.text, q.a, q.options.filter(o => o !== q.a)) : a.i === q.ai);
    const speed = T && a ? Math.max(0, 1 - a.ms / T) : 1;
    const pp = Math.round(DIFF[q.d].base * (T ? 0.5 + 0.5 * speed : 1));
    const pts = correct ? pp : 0;
    p.score += pts; H.results[pid] = {correct, pts, pp, answered:!!a, text:a ? a.text : null};
  }
  H.phase = "reveal"; stopTick(); saveHost(); broadcast(); render();
}
// game master override for typed answers: tap a player's answer to accept or reject it
function judge(pid){
  const r = H.results[pid], p = H.players[pid];
  if (H.phase !== "reveal" || !r || !r.answered || !p) return;
  r.correct = !r.correct;
  r.pts = r.correct ? r.pp : 0;
  p.score += r.correct ? r.pp : -r.pp;
  saveHost(); broadcast(); render();
}
function hostNext(){
  if (H.qn + 1 >= H.deck.length){ H.phase = "final"; saveHost(); broadcast(); render(); return; }
  H.qn++; startQuestion();
}
function hostToLobby(){ H.phase = "lobby"; H.deck = []; H.qn = 0; H.answers = {}; H.results = {}; Object.values(H.players).forEach(p => p.score = 0); saveHost(); broadcast(); render(); }

function startTick(){
  stopTick();
  tickId = setInterval(() => {
    if (role === "host"){
      if (H.phase !== "question" || !H.qEndsAt){ stopTick(); return; }
      const left = H.qEndsAt - Date.now();
      paintTimer(left, H.settings.timer * 1000);
      if (left <= 0) reveal();
    } else if (role === "player"){
      const v = P.view;
      if (!v || v.phase !== "question" || !P.deadline){ stopTick(); return; }
      paintTimer(P.deadline - Date.now(), v.timer * 1000);
    }
  }, 100);
}
function stopTick(){ if (tickId){ clearInterval(tickId); tickId = null; } }
function paintTimer(left, total){
  left = Math.max(0, left);
  const f = $("#tfill"), n = $("#tnum");
  if (f){ f.style.width = (left / total * 100) + "%"; f.classList.toggle("low", left < 5000); }
  if (n) n.textContent = Math.ceil(left / 1000);
}

/* =================== PLAYER =================== */
function playerJoin(code, name){
  code = code.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  name = name.trim().slice(0, 16);
  if (code.length !== 4){ homeErr = "Room codes are 4 letters."; return render(); }
  if (!name){ homeErr = "Add your name so the scoreboard knows who you are."; return render(); }
  homeErr = "";
  const saved = store.get("lastcall-live-player");
  const pid = saved && saved.code === code ? saved.pid : uid();
  store.set("lastcall-live-player", {code, name, pid});
  role = "player";
  P = {code, name, pid, status:"connecting", view:null, ever:false, deadline:0, hostOnline:null};
  playerNet(0);
  render();
}
function playerNet(i){
  dropNet();
  const base = TOPIC + P.code;
  connectBroker(i, client => {
    if (role !== "player"){ client.end(true); return; }
    net = client;
    const subscribe = () => client.subscribe([base + "/host", base + "/down/" + P.pid], {qos:1});
    client.on("message", (topic, buf) => {
      const m = parse(buf);
      if (topic === base + "/host"){
        if (m && m.online){ const was = P.hostOnline; P.hostOnline = true; if (!P.ever) sendJoin(); else if (!was) render(); }
        else { P.hostOnline = false; if (P.ever) render(); }
      } else if (m && m.t === "view") onView(m);
    });
    client.on("connect", () => { subscribe(); if (P.ever){ P.status = "connected"; sendJoin(); render(); } });
    client.on("offline", () => { if (P.ever){ P.status = "lost"; render(); } });
    subscribe(); startBeat();
    // the host keeps a "room is open" flag on the broker; no flag after a few seconds means no such room here
    setTimeout(() => {
      if (role !== "player" || net !== client || P.ever || P.hostOnline) return;
      P.status = "notfound"; render();
    }, 5000);
  }, () => {
    if (role !== "player") return;
    if (i + 1 < BROKERS.length) playerNet(i + 1); else { P.status = "error"; render(); }
  }, {will:{topic:base + "/up", payload:JSON.stringify({t:"leave", pid:P.pid}), qos:1, retain:false}});
}
function sendJoin(){ pub(TOPIC + P.code + "/up", {t:"join", pid:P.pid, name:P.name}); }
function onView(msg){
  const prev = P.view; P.view = msg; P.ever = true; P.status = "connected"; P.hostOnline = true;
  if (msg.phase === "question" && msg.remaining != null) P.deadline = Date.now() + msg.remaining;
  if (msg.phase === "question" && msg.remaining != null && !(prev && prev.phase === "question" && prev.qn === msg.qn && prev.my === msg.my)) startTick();
  render();
}
function playerAnswer(i){
  const v = P.view;
  if (!v || v.phase !== "question" || v.my != null || !net || !net.connected) return;
  v.my = i;
  pub(TOPIC + P.code + "/up", {t:"answer", pid:P.pid, qn:v.qn, i});
  render();
}
function playerSendText(text){
  const v = P.view;
  text = String(text || "").trim().slice(0, 60);
  if (!text || !v || v.phase !== "question" || v.my != null || !net || !net.connected) return;
  v.my = text;
  pub(TOPIC + P.code + "/up", {t:"answer", pid:P.pid, qn:v.qn, text});
  render();
}
function leave(){
  stopTick();
  if (beatId){ clearInterval(beatId); beatId = null; }
  if (role === "host" && H) pub(TOPIC + H.code + "/host", null, true);   // clear the "room is open" flag
  else if (role === "player" && P) pub(TOPIC + P.code + "/up", {t:"leave", pid:P.pid});
  const c = net; net = null;
  if (c) setTimeout(() => { try{ c.end(); }catch(e){} }, 300);
  role = null; P = null; render();
}

/* =================== RENDER =================== */
function render(){
  const app = $("#app"), where = $("#where"), acts = $("#barActions");
  if (role === "host") return renderHost(app, where, acts);
  if (role === "player") return renderPlayer(app, where, acts);
  where.textContent = ""; acts.innerHTML = "";
  const saved = store.get("lastcall-live-host"), me = store.get("lastcall-live-player");
  const hashCode = (location.hash || "").replace(/[^A-Za-z]/g, "").toUpperCase().slice(0, 4);
  app.innerHTML = `
  <section class="hero">
    <h1>Last Call <span>Live</span></h1>
    <p>Live party trivia. One screen hosts and shows the questions; everyone answers on their own phone. Faster right answers score more.</p>
  </section>
  ${hasNet ? "" : `<p class="banner bad">The multiplayer connection library didn't load. This page needs an internet connection; reload once you're online.</p>`}
  <div class="home"${hashCode ? ` style="grid-template-columns:minmax(0,1fr);max-width:520px"` : ""}>
    <section class="panel">
      <h3>${hashCode ? `Join room ${esc(hashCode)}` : "Join a game"}</h3>
      <p class="hint">${hashCode ? "Add your name and tap Join." : "Get the 4-letter code from the host's screen, or scan the QR code on it."}</p>
      <div class="field"><label class="label" for="code">Room code</label><input class="input codeinput" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" value="${esc(hashCode || (me && me.code) || "")}" placeholder="ABCD"></div>
      <div class="field"><label class="label" for="name">Your name</label><input class="input" id="name" maxlength="16" autocomplete="nickname" value="${esc((me && me.name) || "")}" placeholder="e.g. Sam"></div>
      ${homeErr ? `<p class="err">${esc(homeErr)}</p>` : ""}
      <button class="btn big" data-act="join" ${hasNet ? "" : "disabled"}>Join</button>
    </section>
    ${hashCode ? "" : `<section class="panel">
      <h3>Host a game</h3>
      <p class="hint"><b>Only one person hosts</b>, on the laptop or TV everyone can see. Everyone else taps <b>Join</b>. Pressing Host on a phone starts a separate, empty room.</p>
      ${confirmHost
        ? `<div class="hostnote"><p class="err" style="margin:0">This looks like a phone. Players should use Join, not Host.</p><div class="actions"><button class="btn" data-act="hostYes">I'm the host, continue</button><button class="btn ghost" data-act="hostNo">Go back</button></div></div>`
        : `<button class="btn ghost big" data-act="host" ${hasNet ? "" : "disabled"}>Host on this screen</button>`}
      ${saved && saved.code && Object.keys(saved.players || {}).length ? `<button class="btn ghost" data-act="resumeHost" ${hasNet ? "" : "disabled"}>Resume room ${esc(saved.code)} (${Object.keys(saved.players).length} players)</button>` : ""}
    </section>`}
  </div>`;
}

function joinUrl(){
  if (!/^https?:$/.test(location.protocol)) return "";
  return location.origin + location.pathname + "?v=" + VERSION + "#" + H.code;
}

function renderHost(app, where, acts){
  where.textContent = H.phase === "lobby" ? "Lobby" : H.phase === "final" ? "Final scores" : `Question ${H.qn+1} of ${H.deck.length}`;
  acts.innerHTML = `<span class="tag" title="Room code">Room ${esc(H.code)}</span>` + (H.phase === "lobby" ? `<button class="btn ghost sm" data-act="leave">Close room</button>` :
    `<button class="btn ${confirmEnd ? "warn" : "ghost"} sm" data-act="endGame">${confirmEnd ? "Tap again to end" : "End game"}</button>`);
  const status = H.status === "online" ? "" : H.status === "error"
    ? `<div class="banner bad">${esc(H.error)} <button class="btn sm" data-act="retryHost">Retry</button></div>`
    : `<div class="banner">Opening room ${esc(H.code)}&hellip;</div>`;
  const s = H.settings, players = Object.entries(H.players);
  const online = players.filter(([,p]) => p.online);

  if (H.phase === "lobby"){
    const url = joinUrl();
    const chips = (act, opts, cur) => opts.map(([v,l]) => `<button class="chip" data-act="${act}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join("");
    app.innerHTML = `${status}<div class="host">
      <section class="stage">
        <div class="joinbox">
          <p class="eyebrow">${url ? "Scan to join, or enter the code" : "Join on your phone with code"}</p>
          ${url ? `<div class="qr" id="qr" aria-label="QR code to join"></div>` : ""}
          <p class="bigcode">${esc(H.code)}</p>
          <p class="hint" style="font-size:17px">Open the game on your phone, tap <b>Join</b> (not Host), type the code and your name.</p>
          ${url ? `<p class="joinlink">${esc(url)}</p>` : ""}
        </div>
        <div style="display:grid;gap:10px"><p class="eyebrow">${online.length} player${online.length === 1 ? "" : "s"} in the room</p>
          <div class="players">${players.length ? players.map(([,p]) => `<span class="pchip ${p.online ? "" : "off"}">${esc(p.name)}</span>`).join("") : `<span class="hint">Waiting for the first player&hellip;</span>`}</div></div>
        <div class="actions"><button class="btn big" data-act="start" ${online.length && s.cats.length ? "" : "disabled"}>${online.length ? `Start with ${online.length} player${online.length === 1 ? "" : "s"}` : "Waiting for players"}</button></div>
      </section>
      <aside class="rail">
        <section class="panel">
          <h2>Game settings</h2>
          <div><span class="label">Answers</span><div class="seg" style="margin-top:6px">${chips("mode", [["typed","Type it (typos OK)"],["choice","Multiple choice"]], s.mode)}</div></div>
          <div><span class="label">Questions</span><div class="seg" style="margin-top:6px">${chips("count", [[10,"10"],[15,"15"],[20,"20"],[30,"30"]], s.count)}</div></div>
          <div><span class="label">Answer time</span><div class="seg" style="margin-top:6px">${chips("timer", [[15,"15s"],[20,"20s"],[30,"30s"],[0,"No limit"]], s.timer)}</div></div>
          <div><span class="label">Difficulty</span><div class="seg" style="margin-top:6px">${chips("diff", [["mixed","Ramps up"],["e","Easy"],["m","Medium"],["h","Hard"]], s.diff)}</div></div>
          <div><span class="label">Drinking mode</span><div class="seg" style="margin-top:6px">${chips("drinks", [[true,"Wrong = a sip"],[false,"Off"]], s.drinks)}</div></div>
        </section>
        <section class="panel">
          <h2>Categories</h2>
          <div class="seg">${Object.entries(CATS).map(([k,c]) => `<button class="chip" data-act="cat" data-v="${k}" aria-pressed="${s.cats.includes(k)}">${esc(c.name)}</button>`).join("")}</div>
          <div class="seg"><button class="btn ghost sm" data-act="allCats">All</button><button class="btn ghost sm" data-act="noCats">None</button></div>
        </section>
      </aside></div>`;
    const qr = $("#qr");
    if (qr && url && typeof QRCode !== "undefined"){ try{ new QRCode(qr, {text:url, width:360, height:360, colorDark:"#16112a", colorLight:"#f6eedd", correctLevel:QRCode.CorrectLevel.M}); }catch(e){ qr.remove(); } }
    else if (qr) qr.remove();
    return;
  }

  const board = (deltas) => `<section class="panel"><h2>Leaderboard</h2><ol class="board">${ranking().map((p,i) => {
      const r = H.results[p.pid];
      const note = deltas && r ? (r.correct ? `<small class="up">+${r.pts}</small>` : `<small class="miss">${r.answered ? "Wrong" : "No answer"}</small>`) : (!p.online ? `<small class="miss">Disconnected</small>` : "");
      return `<li><span class="pos">${i+1}</span><span class="nm">${esc(p.name)}${note}</span><span class="sc">${p.score}</span></li>`; }).join("")}</ol></section>`;

  if (H.phase === "final"){
    const r = ranking(), top = r[0];
    app.innerHTML = `${status}<div class="host"><section class="stage" style="text-align:center;justify-items:center">
        <p class="eyebrow">Last call &middot; ${H.deck.length} questions</p>
        <p class="bigcode" style="font-size:clamp(40px,8vw,90px);letter-spacing:0">${top ? esc(top.name) : "Nobody"}</p>
        <p class="hint" style="font-size:20px">wins with ${top ? top.score : 0} points.${H.settings.drinks && r.length > 1 ? ` ${esc(r[r.length-1].name)} finished last: take a sip.` : ""}</p>
        <div class="actions" style="justify-content:center"><button class="btn big" data-act="again">Play again (same players)</button><button class="btn ghost big" data-act="leave">Close room</button></div>
      </section><aside class="rail">${board(false)}</aside></div>`;
    return;
  }

  const q = H.deck[H.qn], isRev = H.phase === "reveal";
  const counts = [0,0,0,0]; Object.values(H.answers).forEach(a => counts[a.i]++);
  const answeredN = Object.keys(H.answers).length;
  const opts = q.options.map((o,i) => `<div class="hopt o${i} ${isRev ? (i === q.ai ? "right" : "dim") : ""}">
      ${isRev ? `<span class="barfill" style="width:${answeredN ? counts[i] / answeredN * 100 : 0}%"></span>` : ""}
      <span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span>${isRev ? `<span class="n">${counts[i]}</span>` : ""}</div>`).join("");
  const typed = H.mode === "typed";
  let body = `<div class="tags"><span class="tag">${esc(CATS[q.cat].name)}</span><span class="tag diff d-${q.d}">${DIFF[q.d].label} &middot; up to ${DIFF[q.d].base}</span>${typed ? `<span class="tag">Type your answer</span>` : ""}</div>
      <p class="hq">${esc(q.q)}</p>${typed ? (isRev ? `<p class="bigans">${esc(q.a)}</p>` : "") : `<div class="hopts">${opts}</div>`}`;
  if (!isRev){
    body += H.qEndsAt ? `<div class="tline"><div class="track"><div class="fill" id="tfill"></div></div><span class="tnum" id="tnum">${H.settings.timer}</span></div>` : "";
    body += `<div style="display:grid;gap:8px"><p class="eyebrow">${answeredN} of ${online.length} answered</p>
      <div class="players">${players.filter(([pid,p]) => p.online || H.answers[pid]).map(([pid,p]) => `<span class="pchip ${H.answers[pid] ? "done" : ""}">${esc(p.name)}</span>`).join("")}</div></div>
      <div class="actions"><button class="btn" data-act="reveal">Reveal answer now</button></div>`;
  } else {
    const missed = players.filter(([pid]) => !H.results[pid]?.correct).map(([,p]) => p.name);
    if (typed){
      body += `<div style="display:grid;gap:8px"><p class="eyebrow">What everyone typed &middot; tap one to accept or reject it</p>
        <div class="judge">${players.map(([pid,p]) => { const r = H.results[pid] || {};
          if (!r.answered) return `<span class="jchip none"><span class="who">${esc(p.name)}</span><span class="said">no answer</span></span>`;
          return `<button class="jchip ${r.correct ? "ok" : "no"}" data-act="judge" data-pid="${esc(pid)}"><span class="mark">${r.correct ? "&#10003;" : "&#10007;"}</span><span class="who">${esc(p.name)}</span><span class="said">${esc(r.text)}</span></button>`; }).join("")}</div></div>`;
    } else body += `<p class="answerline">Answer: <b>${"ABCD"[q.ai]}. ${esc(q.a)}</b></p>`;
    if (H.settings.drinks) body += missed.length ? `<div class="sips"><b>Take a sip</b><span>${missed.map(esc).join(", ")}</span></div>` : `<div class="banner ok">Everyone got it. Cheers, nobody drinks!</div>`;
    body += `<div class="actions"><button class="btn big" data-act="next">${H.qn + 1 >= H.deck.length ? "See final scores" : "Next question"}</button></div>`;
  }
  app.innerHTML = `${status}<div class="host"><section class="stage">${body}</section><aside class="rail">${board(isRev)}</aside></div>`;
  if (!isRev && H.qEndsAt){ paintTimer(H.qEndsAt - Date.now(), H.settings.timer * 1000); if (!tickId) startTick(); }
}

function renderPlayer(app, where, acts){
  const v = P.view;
  where.textContent = `Room ${P.code}`;
  acts.innerHTML = `<button class="btn ghost sm" data-act="leave">Leave</button>`;
  let banner = "";
  if (P.status === "connecting") banner = `<div class="banner">Joining room ${esc(P.code)}&hellip;</div>`;
  if (P.status === "lost") banner = `<div class="banner bad">Connection dropped. Reconnecting&hellip;</div>`;
  else if (P.ever && P.hostOnline === false) banner = `<div class="banner bad">The host's screen went offline. Waiting for it to come back&hellip;</div>`;
  if (P.status === "notfound"){
    app.innerHTML = `<div class="phone"><div class="pcard"><h2>Looking for room ${esc(P.code)}&hellip;</h2><p class="hint">No open room with that code yet. Check the code on the host's screen. This page keeps looking and joins as soon as the room opens.</p><button class="btn ghost big" data-act="leave">Change code</button></div></div>`;
    return;
  }
  if (P.status === "error"){
    app.innerHTML = `<div class="phone"><div class="pcard"><h2>Can't connect</h2><p class="hint">Couldn't reach the game server. Check your internet connection (Wi-Fi or mobile data) and try again.</p><button class="btn big" data-act="leave">Back</button></div></div>`;
    return;
  }
  if (!v){ app.innerHTML = `<div class="phone">${banner}</div>`; return; }
  const stats = `<div class="stat"><div><b>${v.score}</b><span>Points</span></div><div><b>${ordinal(v.rank)}</b><span>of ${v.players}</span></div></div>`;
  let body = "";
  if (v.phase === "lobby"){
    body = `<div class="pcard"><p class="eyebrow">You're in room <span class="roomtag">${esc(v.code)}</span></p><h2>${esc(v.name)}</h2>
      <div class="players" style="justify-content:center">${(v.names || []).map(n => `<span class="pchip ${n === v.name ? "done" : ""}">${esc(n)}</span>`).join("")}</div>
      <p class="hint">Everyone above is in this game. If a friend is missing, check they joined code ${esc(v.code)}. The host will start soon; keep this screen open.</p></div>`;
  } else if (v.phase === "question" && v.q){
    const locked = v.my != null;
    body = `<div class="pcard" style="text-align:left">
      <div class="tags"><span class="tag">Q${v.qn+1}/${v.count}</span><span class="tag">${esc(v.q.cat)}</span><span class="tag diff d-${v.q.d}">${DIFF[v.q.d].label}</span></div>
      <p class="pq">${esc(v.q.text)}</p>
      ${v.remaining != null ? `<div class="tline"><div class="track"><div class="fill" id="tfill"></div></div><span class="tnum" id="tnum"></span></div>` : ""}
      ${v.mode === "typed"
        ? (locked ? `<p class="mine-text">Your answer: <q>${esc(v.my)}</q></p>`
                  : `<form class="typed" data-form="typed"><input class="input" id="ans" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" aria-label="Your answer"><button class="btn" type="submit">Send</button></form><p class="hint">Small spelling mistakes are fine.</p>`)
        : `<div class="pbtns">${v.q.options.map((o,i) => `<button class="pbtn o${i} ${v.my === i ? "mine" : ""}" data-act="answer" data-v="${i}" ${locked ? "disabled" : ""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`}
      ${locked ? `<p class="hint" style="text-align:center">Locked in. Waiting for everyone else&hellip;</p>` : ""}
    </div>`;
  } else if (v.phase === "reveal" && v.result){
    const r = v.result;
    body = `<div class="pcard">
      <p class="verdict ${r.correct ? "good" : "bad"}">${r.correct ? `+${r.pts}` : v.my == null ? "Too slow" : "Wrong"}</p>
      ${v.mode === "typed" && v.my != null ? `<p class="mine-text">You said <q>${esc(v.my)}</q></p>` : ""}
      <p class="pq">${r.correct ? (v.mode === "typed" ? `Answer: <b style="color:var(--mint)">${esc(r.answer)}</b>` : "Nice one.") : `The answer was <b style="color:var(--mint)">${esc(r.answer)}</b>.`}</p>
      ${!r.correct && v.drinks ? `<div class="sipcall">Take a sip.</div>` : ""}
      ${stats}<p class="hint">Next question coming up&hellip;</p></div>`;
  } else if (v.phase === "final"){
    body = `<div class="pcard"><p class="eyebrow">Final result</p><h2>You came ${ordinal(v.rank)}</h2>${stats}
      <ol class="board" style="text-align:left">${(v.top || []).map((x,i) => `<li><span class="pos">${i+1}</span><span class="nm">${esc(x.name)}</span><span class="sc">${x.score}</span></li>`).join("")}</ol>
      <p class="hint">Stay here if the host starts another game.</p></div>`;
  }
  const old = $("#ans"), draft = old ? old.value : "", focused = old && document.activeElement === old;
  app.innerHTML = `<div class="phone">${banner}${body}</div>`;
  const ans = $("#ans");
  if (ans){ ans.value = draft; if (focused || !draft) ans.focus(); }
  if (v.phase === "question" && v.remaining != null) paintTimer(P.deadline - Date.now(), v.timer * 1000);
}

/* =================== EVENTS =================== */
const toggle = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
const actions = {
  join: () => playerJoin($("#code").value, $("#name").value),
  host: () => { if (window.matchMedia && (matchMedia("(max-width: 760px)").matches || matchMedia("(pointer: coarse)").matches)){ confirmHost = true; render(); } else hostCreate(false); },
  hostYes: () => { confirmHost = false; hostCreate(false); },
  hostNo: () => { confirmHost = false; render(); },
  resumeHost: () => { H = store.get("lastcall-live-host"); hostCreate(true); },
  retryHost: () => { H.status = "connecting"; openHostNet(0); render(); },
  leave: () => { if (role === "host"){ store.del("lastcall-live-host"); } leave(); },
  count: ({v}) => { H.settings.count = +v; saveHost(); render(); },
  timer: ({v}) => { H.settings.timer = +v; saveHost(); render(); },
  diff: ({v}) => { H.settings.diff = v; saveHost(); render(); },
  mode: ({v}) => { H.settings.mode = v; saveHost(); render(); },
  judge: ({pid}) => judge(pid),
  drinks: ({v}) => { H.settings.drinks = v === "true"; saveHost(); render(); },
  cat: ({v}) => { H.settings.cats = toggle(H.settings.cats, v); saveHost(); render(); },
  allCats: () => { H.settings.cats = Object.keys(CATS); saveHost(); render(); },
  noCats: () => { H.settings.cats = []; saveHost(); render(); },
  start: () => hostStart(),
  reveal: () => reveal(),
  next: () => hostNext(),
  again: () => hostToLobby(),
  endGame: () => { if (confirmEnd){ confirmEnd = false; stopTick(); H.phase = "final"; saveHost(); broadcast(); } else confirmEnd = true; render(); },
  answer: ({v}) => playerAnswer(+v)
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  if (el.dataset.act !== "endGame") confirmEnd = false;
  actions[el.dataset.act]?.(el.dataset);
});
document.addEventListener("submit", e => {
  if (e.target.matches('[data-form="typed"]')){ e.preventDefault(); playerSendText($("#ans").value); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !role && e.target.matches("#code,#name")) actions.join();
  if (role === "player" && P?.view?.phase === "question" && P.view.mode !== "typed" && !e.target.matches("input")){
    const i = "abcd".indexOf(e.key.toLowerCase()); if (i >= 0) playerAnswer(i);
  }
});
window.addEventListener("beforeunload", e => { if (role === "host" && H.phase !== "lobby" && H.phase !== "final"){ e.preventDefault(); e.returnValue = ""; } });

render();
</script>
</body>
</html>
